name: gate

# tests/gate-steps.sh: every check of the pre-merge gate (tests/check-local.sh
# runs the same list). Lint runs in lint.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Self-hosted runners: macOS arm64 and Linux arm64.
        runner: [macos-arm64, linux-arm64]
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Pull requests run the fast tier unless they change what the recorded
      # oracle hashes rest on: the Java source, the case table or the fixtures.
      # Pushes to main, manual runs and the nightly run use the full gate.
      - name: Choose the gate tier
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          tier="full"
          if [ "$EVENT" = pull_request ]; then
            tier="pr"
            if git diff --name-only "$BASE_SHA" HEAD \
                | grep -E '^(java/|tests/(oracle-cases\.txt|fetch-fixtures\.sh|cases\.sh|check-oracle\.sh))'; then
              tier="full"
            fi
          fi
          echo "GATE_TIER=$tier" >> "$GITHUB_ENV"
          echo "gate tier: $tier"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 0.11.32
      - name: Install htslib (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ ! -e /usr/include/htslib/hts.h ] || ! command -v tabix > /dev/null; then
            sudo apt-get update && sudo apt-get install -y libhts-dev tabix
          fi
      - name: Install htslib (macOS)
        if: runner.os == 'macOS'
        run: brew list htslib > /dev/null 2>&1 || brew install htslib
      # The plink2 build tests/check-bgen.sh pins (see docs/testing.md). plink2
      # has no Linux arm64 build, so the Linux runner runs the x86_64 binary
      # through the host's x86_64 emulation.
      - name: Install plink2 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fSL -o plink2.zip https://s3.amazonaws.com/plink2-assets/alpha7/plink2_linux_x86_64_20260919.zip
          echo "7ded2a083cf6863e997099d1adf5e4b86ad6b5112d2934e2b020cfd77f9bdaeb  plink2.zip" | sha256sum -c -
          unzip -o plink2.zip plink2 -d "$RUNNER_TEMP/plink2"
      - name: Install plink2 (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fSL -o plink2.zip https://s3.amazonaws.com/plink2-assets/alpha7/plink2_mac_arm64_20260919.zip
          echo "04be4b865ad4b79a61b61ba2eb7468b4dbf62674dc5f7c94484fe0e5471539e4  plink2.zip" | shasum -a 256 -c -
          unzip -o plink2.zip plink2 -d "$RUNNER_TEMP/plink2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data
          key: fixtures-${{ hashFiles('tests/fetch-fixtures.sh') }}
      - name: Gate
        run: PLINK2="$RUNNER_TEMP/plink2/plink2" tests/gate-steps.sh .
      - name: Tail of every check log
        if: failure()
        run: tail -n 40 build/check-*.log
